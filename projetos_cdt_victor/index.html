<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymFit - Sua Academia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; line-height: 1.6; }
        header { background-color: #1e1e1e; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff4500; }
        .logo { font-size: 28px; font-weight: bold; color: #ff4500; text-transform: uppercase; }
        nav a { color: #ffffff; text-decoration: none; margin-left: 20px; font-weight: 500; }
        nav a:hover { color: #ff4500; }
        .hero { height: 60vh; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1200') center/cover; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 20px; }
        .hero h1 { font-size: 48px; margin-bottom: 15px; text-transform: uppercase; }
        .btn-principal { background-color: #ff4500; color: #ffffff; padding: 12px 30px; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; text-decoration: none; }
        .login-section { background-color: #181818; padding: 60px 20px; text-align: center; }
        .form-container { max-width: 400px; margin: 0 auto; background-color: #1e1e1e; padding: 30px; border-radius: 8px; }
        .form-container h2 { margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 14px; }
        .input-group input { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #333; background-color: #121212; color: #fff; }
        .btn-submit { width: 100%; background-color: #ff4500; color: #fff; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        footer { background-color: #0a0a0a; text-align: center; padding: 20px; color: #777; border-top: 1px solid #222; }
    </style>
</head>
<body>
    <header>
        <div class="logo">GymFit</div>
        <nav>
            <a href="#inicio">Início</a>
            <a href="#login">Área do Aluno</a>
        </nav>
    </header>

    <section id="inicio" class="hero">
        <h1>Transforme Seu Corpo Hoje</h1>
        <a href="#login" class="btn-principal">Área do Aluno</a>
    </section>

    <section id="login" class="login-section">
        <div class="form-container">
            <h2>Área do Aluno</h2>
            <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Login efetuado!');">
                <div class="input-group">
                    <label for="username">Usuário ou CPF</label>
                    <input type="text" id="username" name="username" placeholder="Digite seu usuário" required>
                </div>
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
                </div>
                <button type="submit" class="btn-submit">Entrar</button>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 GymFit. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
